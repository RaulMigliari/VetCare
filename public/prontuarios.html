<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prontuários | VetCare</title>
  <link rel="stylesheet" href="styles/prontuarios.css">
  <link rel="icon" href="/public/assets/vetcareLogo.png" type="image/png">
</head>
<body>
  <header class="dashboard-header">
    <div class="logo">
      <a href="dashboard-clinica.html"><img src="/public/assets/vetcareLogo.png" alt="Logo VetCare"></a>
      <h1>VetCare Clínica</h1>
    </div>
    <nav>
      <a href="dashboard-clinica.html" class="back-btn">Voltar</a>
    </nav>
  </header>

  <main class="dashboard-main">
    <section class="prontuario-section">
      <h2>Buscar Prontuário por Pet</h2>

      <form id="buscarForm">
        <input type="text" id="nomePet" placeholder="Digite o nome do pet..." required>
        <button type="submit">Buscar</button>
      </form>

      <div id="resultadoBusca" class="resultado"></div>

      <section class="novo-prontuario" style="display: none;">
        <h3>Adicionar Novo Prontuário</h3>
        <form id="formNovoProntuario">
          <input type="text" id="veterinario" placeholder="Nome do veterinário" required>
          <textarea id="descricao" placeholder="Descrição do atendimento" required></textarea>
          <button type="submit">Salvar Prontuário</button>
        </form>
      </section>
    </section>
  </main>

  <script src="scripts/prontuarios.js" type="module"></script>
  <script src="./scripts/protect.js" type="module"></script>
</body>
</html>
