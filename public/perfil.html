<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil | VetCare</title>
  <link rel="stylesheet" href="styles/perfil.css">
  <link rel="icon" href="/public/assets/vetcareLogo.png" type="image/png">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="dashboard-header">
    <div class="logo">
      <img src="/public/assets/vetcareLogo.png" alt="Logo VetCare">
      <h1>VetCare</h1>
    </div>
    <nav>
      <a href="dashboard-cliente.html" class="back-btn">Voltar</a>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="dashboard-main">
    <section class="perfil-section">
      <h2>Meu Perfil</h2>
      <form id="perfilForm">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" required>
        </div>

        <button type="submit" class="save-btn">Salvar Alterações</button>
      </form>
    </section>
  </main>
</body>
</html>
