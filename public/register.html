<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Cliente e Pet | VetCare</title>
  <link rel="stylesheet" href="styles/register.css">
  <link rel="icon" href="/public/assets/vetcareLogo.png" type="image/png">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="register-header">
    <div class="logo">
      <a href="index.html"><img src="/public/assets/vetcareLogo.png" alt="Logo VetCare"></a>
      <h1>VetCare</h1>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="register-main">
    <section class="register-section">
      <h2>Cadastro de Cliente e Pet</h2>
      <form id="registerForm">

        <fieldset>
          <legend>Dados do Cliente</legend>

          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" required>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>Dados do Pet</legend>

          <div class="form-group">
            <label for="nomePet">Nome do Pet</label>
            <input type="text" id="nomePet" required>
          </div>

          <div class="form-group">
            <label for="racaPet">Raça</label>
            <input type="text" id="racaPet" required>
          </div>

          <div class="form-group">
            <label for="idadePet">Idade</label>
            <input type="number" id="idadePet" required min="0">
          </div>
        </fieldset>

        <button type="submit" class="register-btn">Cadastrar</button>
      </form>

      <div class="back-to-login">
        <p>Já tem uma conta? <a href="login.html?tipo=cliente">Faça login</a></p>
      </div>
    </section>
  </main>
  
  <script src="scripts/register.js" type="module"></script>
</body>
</html>
