<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda do Dia | VetCare</title>
  <link rel="stylesheet" href="styles/agenda.css">
  <link rel="icon" href="/public/assets/vetcareLogo.png" type="image/png">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="dashboard-header">
    <div class="logo">
      <a href="dashboard-clinica.html"><img src="/public/assets/vetcareLogo.png" alt="Logo VetCare"></a>
      <h1>VetCare Clínica</h1>
    </div>
    <nav>
      <a href="dashboard-clinica.html" class="back-btn">Voltar</a>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="dashboard-main">
    <section class="agenda-section">
      <h2>Agenda do Dia</h2>

      <div class="agenda-grid">
        <!-- Cada consulta -->
        <div class="consulta-card">
          <h3>Rex - Consulta Clínica</h3>
          <p>Horário: 09:00</p>
          <p>Tutor: João Silva</p>
          <p>Status: Confirmada</p>
        </div>

        <div class="consulta-card">
          <h3>Luna - Retorno</h3>
          <p>Horário: 11:00</p>
          <p>Tutor: Maria Oliveira</p>
          <p>Status: Confirmada</p>
        </div>

        <div class="consulta-card">
          <h3>Bob - Vacinação</h3>
          <p>Horário: 14:30</p>
          <p>Tutor: Lucas Pereira</p>
          <p>Status: Confirmada</p>
        </div>
        <!-- Mais consultas serão listadas aqui futuramente -->
      </div>
    </section>
  </main>
</body>
</html>
