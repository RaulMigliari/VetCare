<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pets | VetCare</title>
  <link rel="stylesheet" href="styles/pets.css">
  <link rel="icon" href="/public/assets/vetcareLogo.png" type="image/png">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="dashboard-header">
    <div class="logo">
      <img src="/public/assets/vetcareLogo.png" alt="Logo VetCare">
      <h1>VetCare</h1>
    </div>
    <nav>
      <a href="dashboard-cliente.html" class="back-btn">Voltar</a>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="dashboard-main">
    <section class="pets-section">
      <h2>Meus Pets</h2>
      <div class="pets-grid">
        <!-- Cards de pets serão adicionados via JavaScript futuramente -->
        <div class="pet-card">
          <img src="/public/assets/dog-icon.png" alt="Pet">
          <h3>Rex</h3>
          <p>Raça: Labrador</p>
          <p>Idade: 3 anos</p>
        </div>
      </div>

      <a href="#" class="add-pet-btn">+ Adicionar Novo Pet</a>
    </section>
  </main>
</body>
</html>
